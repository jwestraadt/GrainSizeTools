[project]
name = "grainsizetools-jwestraadt"
version = "3.2.1"
description = "Tools for quantifying grain size populations and paleopiezometry from thin sections"
authors = [
    { name = "Johan Westraadt" },
]
maintainers = [
    { name = "Johan Westraadt" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.11",
    "pandas>=0.16",
    "scipy>=1.0",
    "matplotlib>=2.0.2",
    "pyyaml>=5.0",
]

[project.urls]
Homepage = "https://marcoalopez.github.io/GrainSizeTools/"
Repository = "https://github.com/jwestraadt/GrainSizeTools"
"Original Project" = "https://github.com/marcoalopez/GrainSizeTools"

[project.optional-dependencies]
jupyter = ["jupyterlab>=4.0"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grain_size_tools"]
