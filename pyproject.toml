[project]
name = "GrainSizeTools"
version = "3.2.0"
description = "Tools for quantifying grain size populations and paleopiezometry from thin sections"
authors = [
    { name = "Marco A. Lopez-Sanchez" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.11",
    "pandas>=0.16",
    "scipy>=1.0",
    "matplotlib>=2.0.2",
    "pyyaml>=5.0",
]

[project.urls]
Homepage = "https://marcoalopez.github.io/GrainSizeTools/"
Repository = "https://github.com/marcoalopez/GrainSizeTools"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grain_size_tools"]
